<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 50px;
        }
        header h1 {
            margin: 0;
        }
        nav {
            text-align: center;
            margin: 20px;
        }
        nav a {
            text-decoration: none;
            color: #333;
            margin: 0 15px;
            padding: 10px;
            border-bottom: 2px solid transparent;
        }
        nav a:hover {
            border-bottom: 2px solid #333;
        }
        section {
            display: flex;
            justify-content: space-around;
            margin: 40px;
        }
        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
    <section>
        <div class="card">
            <h2>Project 1</h2>
            <p>Details about project 1</p>
        </div>
        <div class="card">
            <h2>Project 2</h2>
            <p>Details about project 2</p>
        </div>
        <div class="card">
            <h2>Project 3</h2>
            <p>Details about project 3</p>
        </div>
    </section>
    <footer>
        &copy; 2024 My Portfolio. All Rights Reserved.
    </footer>
</body>
</html>
